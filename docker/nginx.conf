pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ───────────────────────────────────────────────────────────────────────────
  # POR QUÉ EL FORMATO DE ACCESO NO ES EL `combined` DE SERIE
  #
  # NO vuelvas a `access_log /dev/stdout;` a secas ni a `combined`. Parece el
  # formato estándar y por eso es tentador —«el estándar es el que entienden las
  # herramientas»—, pero escribe credenciales en claro en la salida estándar del
  # contenedor, que es la entrada de la tubería hacia CloudWatch/Firehose.
  #
  # `combined` escribe `"$request"` (la línea de petición ENTERA, con su cadena
  # de consulta) y `"$http_referer"`. Las pantallas que se abren desde un enlace
  # de correo reciben en `?token=` lo único que las autoriza. En esta consola son
  # dos: aceptar invitación y aprobar acceso; en el front del tenant hay tres
  # más. De los cinco secretos que hoy viajan bajo el nombre `token` en el
  # monorepo, dos permiten fijar o crear la contraseña de una cuenta — y uno de
  # esos dos es `/aceptar-invitacion`, que se sirve desde aquí.
  #
  # Con `combined` el token se escribe DOS VECES por cada carga de pantalla:
  #
  #   1. en `$request`, al servir el documento
  #      (`GET /aceptar-invitacion?token=SECRETO HTTP/1.1`, que sirve este nginx
  #      vía `try_files … /index.html`);
  #   2. en `$http_referer` de cada `/assets/…` que ese documento pide a
  #      continuación, porque `Referrer-Policy: strict-origin-when-cross-origin`
  #      recorta a solo el origen ENTRE ORÍGENES DISTINTOS, y esas peticiones son
  #      al MISMO origen, donde el navegador manda la URL completa.
  #
  # Esto invierte la mitigación del backend en vez de complementarla:
  # `RequestLoggingContextFilter` escribe `getRequestURI()`, que NO incluye la
  # cadena de consulta, y por eso el backend puso el token en `?token=` y no en
  # un segmento de ruta. Ese acuerdo solo se sostiene si TODO servidor de la
  # cadena hace lo mismo. Y limpiar la barra de direcciones desde el cliente
  # (`src/composables/useTokenDeEnlace.ts`, que está bien) llega tarde para esto:
  # la línea de log ya se escribió antes de que el JavaScript existiera.
  #
  # QUÉ SE CONSERVA, para no perder la utilidad del log: el ORDEN Y EL NÚMERO DE
  # CAMPOS de `combined`, de modo que cualquier analizador que entienda el
  # formato estándar siga leyendo las mismas columnas. Método, ruta completa,
  # protocolo, estado, tamaño y agente siguen ahí. El campo del referer queda
  # como el literal `-`, que es exactamente lo que `combined` ya escribe cuando
  # no hay referer, así que ninguna columna se descuadra. Se añade
  # `$request_time` al final.
  #
  # Y POR QUÉ `$vs_ruta` Y NO `$uri`: `$uri` tampoco arrastra la cadena de
  # consulta, pero `try_files … /index.html` lo REESCRIBE a `/index.html` en
  # TODA ruta del SPA, así que loguearlo dejaría el log sin saber qué pantalla se
  # pidió — justo la otra mitad de lo que este log sirve. `$vs_ruta` es
  # `$request_uri` recortado en el `?`: la ruta original que pidió el navegador,
  # sin el secreto.
  #
  # `tests/unit/security-headers.spec.ts` comprueba que este formato no vuelva a
  # contener ninguna variable que arrastre la cadena de consulta.
  # ───────────────────────────────────────────────────────────────────────────
  map $request_uri $vs_ruta {
    "~^(?<vs_ruta_sin_consulta>[^?]+)" $vs_ruta_sin_consulta;
    default                            $uri;
  }

  log_format vs_sin_credenciales
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $vs_ruta $server_protocol" $status $body_bytes_sent '
    '"-" "$http_user_agent" rt=$request_time';

  # ───────────────────────────────────────────────────────────────────────────
  # POR QUÉ EL `Referrer-Policy` NO ES EL MISMO EN TODAS LAS RUTAS
  #
  # El `log_format` de arriba borra las dos copias del token EN ESTE SERVIDOR.
  # Esto borra la segunda copia EN EL ORIGEN —el navegador deja de enviarla— y
  # por tanto también en los saltos que este archivo no controla: Cloudflare
  # Pages, donde `docker/nginx.conf` ni siquiera existe y `public/_headers` es la
  # única palanca (ver `.github/workflows/deploy-dev.yml`), y cualquier proxy,
  # WAF o balanceador que se ponga delante mañana con su propio registro de
  # acceso. Las dos vías son complementarias: una es exhaustiva pero local, la
  # otra es parcial pero viaja a todos los saltos.
  #
  # ES POR RUTA Y NO GLOBAL A PROPÓSITO. Esta consola no carga nada de terceros
  # —`script-src 'self'`, `img-src 'self' data:`, `frame-src 'none'`—, así que
  # aquí `no-referrer` global no rompería nada, a diferencia del front del
  # tenant, donde sí chocaría con el captcha del registro y con el QR remoto de
  # la DIAN. Se mantiene el mismo mecanismo en los dos repositorios por dos
  # razones: que haya una sola forma de hacer esto y no dos que revisar, y que la
  # lista deje escrito EN LA CONFIGURACIÓN qué pantallas llevan una credencial en
  # la URL. El `Referer` interno sigue sirviendo para diagnosticar de qué
  # pantalla venía el usuario en el resto de la consola.
  #
  # SE RESUELVE CON UN `map` Y UN SOLO `add_header`, no con un `location` por
  # ruta, porque `add_header` NO HEREDA: en cuanto se declara uno dentro de un
  # `location`, se pierden TODOS los del `server`. Hacerlo por `location`
  # obligaría a repetir las ocho cabeceras en cada ruta, y olvidar una dejaría
  # sin CSP justamente la pantalla que crea una contraseña.
  #
  # EL CRITERIO DE LA LISTA ES MECÁNICO: toda ruta cuya vista —o un composable
  # que esa vista monte— lea `route.query.token`. `public/_headers` declara lo
  # mismo para Cloudflare Pages, y `tests/unit/security-headers.spec.ts`
  # comprueba que las dos listas coincidan y que no aparezca un lector de
  # `?token=` nuevo sin su ruta en ellas.
  # ───────────────────────────────────────────────────────────────────────────
  map $vs_ruta $vs_referrer_policy {
    default                "strict-origin-when-cross-origin";
    "/aceptar-invitacion"  "no-referrer";
    "/aprobar-acceso"      "no-referrer";
  }

  # ───────────────────────────────────────────────────────────────────────────
  # LA CACHÉ SE RESUELVE CON UN `map`, NO CON `expires` POR `location`
  #
  # `expires` no sabe emitir `stale-while-revalidate`, y la alternativa —un
  # `add_header Cache-Control` dentro de un `location`— haría perder las ocho
  # cabeceras de seguridad del `server` en esa ruta, porque `add_header` NO
  # HEREDA (el mismo motivo por el que Referrer-Policy se resuelve así). Con un
  # `map` la caché queda declarada en un solo sitio y comparable línea a línea
  # con `public/_headers`, que es lo que verifica
  # `tests/unit/security-headers.spec.ts`.
  #
  # `immutable` solo en `/assets/`, cuyo nombre lleva hash. `/brand/` no lo lleva
  # —`favicon-32x32.png` se llama igual antes y después de un cambio de
  # logotipo—, así que un año inmutable dejaría la marca vieja congelada en cada
  # navegador que ya la hubiera pedido.
  # ───────────────────────────────────────────────────────────────────────────
  map $vs_ruta $vs_cache_control {
    default        "no-cache";
    "~^/assets/"   "public, max-age=31536000, immutable";
    "~^/brand/"    "public, max-age=604800, stale-while-revalidate=86400";
  }

  access_log /dev/stdout vs_sin_credenciales;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain text/xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Espejo de public/_headers (Cloudflare Pages). Los dos archivos deben declarar
    # lo mismo; tests/unit/security-headers.spec.ts falla si divergen. La
    # justificación de cada origen de la CSP está en public/_headers.
    #
    # Referrer-Policy y Cache-Control son las que dependen de la ruta: su valor
    # sale de los `map` de arriba.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy $vs_referrer_policy always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $vs_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://dev-api.kefaro.tech https://api.vetsoftware.co; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /assets/ {
      try_files $uri =404;
    }

    location = /index.html {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
