name: Publish SemVer release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer already merged into main (X.Y.Z)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: frontend-publish-release-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      CI: true
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
      ECR_REPOSITORY: vetsoftware-front
      RELEASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
      RELEASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || format('release/{0}', inputs.version) }}

    steps:
      - name: Check out merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Enforce production-only ECR publication
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual ECR publication is allowed only from main." >&2
            exit 1
          fi

          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]] || {
            echo "The checked-out production commit does not match the release event." >&2
            exit 1
          }

          echo "Production artifact policy confirmed; development never publishes or retains a separate ECR image."

      - name: Validate release version
        id: release
        shell: bash
        run: |
          if [[ ! "$RELEASE_BRANCH" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The version must match strict SemVer X.Y.Z." >&2
            exit 1
          fi
          echo "version=${RELEASE_BRANCH#release/}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify synchronized release metadata
        run: node .github/scripts/release-version.mjs verify "${{ steps.release.outputs.version }}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run global quality gate
        run: npm run quality

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build release
        run: npm run build

      - name: Validate AWS publication configuration
        shell: bash
        run: |
          [[ -n "$AWS_ROLE_TO_ASSUME" ]] || {
            echo "Configure AWS_ECR_PUBLISH_ROLE_ARN in the production environment." >&2
            exit 1
          }

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check release image idempotency
        id: image
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          sha_tag="sha-${RELEASE_COMMIT::12}"
          version_digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$version" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          sha_digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$sha_tag" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"

          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"
          if [[ -z "$version_digest" && -z "$sha_digest" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$version_digest" && "$version_digest" == "$sha_digest" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "The immutable release image already exists with matching version and commit tags."
          else
            echo "ECR contains a partial or conflicting immutable release image." >&2
            exit 1
          fi

      # Sin condicion a proposito. Ademas de autenticar el push, este paso es el
      # que produce `steps.ecr.outputs.registry`, y la extraccion del SBOM
      # necesita ese registro tambien cuando la imagen ya existia y no se
      # reconstruye (re-ejecucion idempotente del workflow).
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up QEMU
        if: steps.image.outputs.push == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.image.outputs.push == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and publish immutable multi-architecture image
        if: steps.image.outputs.push == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.release.outputs.version }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=private-front
          cache-to: type=gha,mode=max,scope=private-front

      # BE-27, «SBOM producido y tirado». `sbom: true` y `provenance: mode=max`
      # de arriba si generan las dos atestaciones y buildx las empuja a ECR como
      # manifiestos referidos del indice -- pero ahi solo son alcanzables por
      # quien tenga credenciales del registro y sepa que existen. Para cruzar un
      # CVE nuevo contra lo que hay desplegado, hace falta el fichero.
      #
      # ALCANCE, para no leer de mas en el documento: BuildKit escanea por
      # defecto SOLO la etapa final, que aqui es nginx sobre Alpine con `dist/`
      # ya compilado dentro. Es decir, el SBOM inventaria el sistema base y NO
      # el arbol npm de la etapa `build` -- no dice que version de axios se
      # empaqueto. Extenderlo requiere `BUILDKIT_SBOM_SCAN_STAGE` mas un `ARG`
      # en el Dockerfile, y va en incidencia aparte.
      #
      # `imagetools inspect` lee las atestaciones del indice ya publicado, asi
      # que esto funciona igual en una re-ejecucion en la que no se reconstruyo
      # nada. `buildx` viene preinstalado en el runner: no depende de que se
      # hayan ejecutado los pasos condicionales de QEMU/Buildx.
      - name: Retain the SBOM and the provenance
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          image="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${version}"

          mkdir -p release-attestations
          docker buildx imagetools inspect "$image" --format '{{ json .SBOM }}' \
            > release-attestations/sbom.json
          docker buildx imagetools inspect "$image" --format '{{ json .Provenance }}' \
            > release-attestations/provenance.json

          # Guardar un fichero con 'null' dentro seria repetir el defecto con
          # mas pasos: si la atestacion no viaja, esto tiene que romperse aqui y
          # no descubrirse durante una auditoria.
          for fichero in sbom provenance; do
            if [[ ! -s "release-attestations/${fichero}.json" ]] \
              || [[ "$(jq -r 'if . == null or . == {} then "vacio" else "ok" end' "release-attestations/${fichero}.json")" != "ok" ]]; then
              echo "::error::La atestacion '${fichero}' no viajo con $image. Revisar 'provenance: mode=max' y 'sbom: true' del paso de build." >&2
              exit 1
            fi
          done

          echo "SBOM: $(wc -c < release-attestations/sbom.json) bytes"
          echo "Provenance: $(wc -c < release-attestations/provenance.json) bytes"

      - name: Upload the SBOM and the provenance as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestations-${{ steps.release.outputs.version }}
          path: release-attestations/
          if-no-files-found: error
          # Una release vive mucho mas que los 90 dias por defecto de un
          # artefacto; el activo de la release es la copia permanente y esto es
          # solo el acceso comodo mientras el despliegue esta caliente.
          retention-days: 90

      - name: Create immutable version tag
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            [[ "$(git rev-list -n 1 "$tag")" == "$(git rev-parse HEAD)" ]] || {
              echo "$tag already points to a different commit." >&2
              exit 1
            }
          else
            git tag --annotate "$tag" --message "VetSoftware Front $version"
            git push origin "refs/tags/$tag"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.release.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --verify-tag \
            --generate-notes \
            --title "VetSoftware Front ${{ steps.release.outputs.version }}"

      # La copia permanente y consultable sin credenciales de ECR. `--clobber`
      # para que una re-ejecucion sobre una release ya creada actualice los
      # activos en vez de fallar.
      - name: Attach the SBOM and the provenance to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.release.outputs.version }}"
          gh release upload "$tag" \
            release-attestations/sbom.json \
            release-attestations/provenance.json \
            --clobber
