name: Publish SemVer release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer already merged into main (X.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: frontend-publish-release-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      CI: true
      RELEASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || format('release/{0}', inputs.version) }}

    steps:
      - name: Check out merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate release version
        id: release
        shell: bash
        run: |
          if [[ ! "$RELEASE_BRANCH" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The version must match strict SemVer X.Y.Z." >&2
            exit 1
          fi
          echo "version=${RELEASE_BRANCH#release/}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify synchronized release metadata
        run: node .github/scripts/release-version.mjs verify "${{ steps.release.outputs.version }}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run global quality gate
        run: npm run quality

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build release
        run: npm run build

      - name: Create immutable version tag
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            [[ "$(git rev-list -n 1 "$tag")" == "$(git rev-parse HEAD)" ]] || {
              echo "$tag already points to a different commit." >&2
              exit 1
            }
          else
            git tag --annotate "$tag" --message "VetSoftware Front $version"
            git push origin "refs/tags/$tag"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.release.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --verify-tag \
            --generate-notes \
            --title "VetSoftware Front ${{ steps.release.outputs.version }}"
