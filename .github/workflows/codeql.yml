name: CodeQL

# BE-27. No habia SAST: cero analisis estatico de seguridad en los 6 workflows.
# ESLint mira estilo y correccion, no taint tracking; `npm audit` mira las
# dependencias, no el codigo que escribimos nosotros. Esto es lo que faltaba:
# el flujo de datos desde una entrada controlable hasta un sink peligroso.
#
# ESTE WORKFLOW NO SE EJECUTA TODAVIA, Y NO ES UN DESCUIDO. Comprobado contra la API
# el 2026-08-19:
#
#   GET /repos/kefaroTech/vetsoftware-admin-web  -> "code_security": {"status": "disabled"}
#   GET /repos/kefaroTech/vetsoftware-admin-web/code-scanning/alerts
#       403 "Code Security must be enabled for this repository to use code scanning."
#   GET /orgs/kefaroTech -> plan "team",
#                           advanced_security_enabled_for_new_repositories: false
#
# El repositorio es privado, y en repositorios privados el code scanning exige GitHub
# Code Security, que no esta contratado. Sin el, codeql-action falla al subir el SARIF
# con ese mismo 403. Por eso el trabajo esta condicionado a la variable de repositorio
# CODE_SECURITY_ENABLED y hoy queda SIN EJECUTAR (visible como "skipped"), no en
# verde: taparlo con continue-on-error lo pintaria de verde mintiendo, y dejarlo
# corriendo lo dejaria en rojo permanente en cada pull request, que es como se enseña
# a un equipo a ignorar los checks rojos.
#
# QUE HAY QUE HACER PARA ACTIVARLO (dos pasos, ningun cambio de codigo):
#   1. Contratar y habilitar GitHub Code Security en kefaroTech/vetsoftware-admin-web.
#   2. Crear la variable de repositorio CODE_SECURITY_ENABLED = true
#      (Settings > Secrets and variables > Actions > Variables).
# Ese dia, este workflow entra en servicio tal cual esta.
#
# ALINEACION DE LOS TRES REPOSITORIOS. Este fichero se mantiene funcionalmente
# equivalente al `codeql.yml` de vetsoftware-backend y vetsoftware-public-web:
# mismos disparadores (pull_request a develop/main con el mismo paths-ignore,
# barrido semanal los lunes a las 08:00 UTC y workflow_dispatch), misma condicion
# (`vars.CODE_SECURITY_ENABLED == 'true'`), mismos permisos y mismos pasos.
# Las unicas divergencias son deliberadas:
#   - `languages:` y `category:`, que nombran el lenguaje real de cada repositorio.
#   - el paso `Set up Java`, que solo existe en el backend.
#   - el prefijo de `concurrency.group`, que sigue la convencion de cada repo.
#   - el texto de los comentarios, que nombra el repositorio.

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  # NO hay disparador `push`: lo que se mezcla a develop llega siempre por un pull
  # request que este mismo workflow ya analizo, asi que un segundo analisis del
  # mismo arbol es pagar dos veces por el mismo resultado.
  #
  # El barrido semanal si hace falta, y por otro motivo: la base de consultas de
  # CodeQL se actualiza sola, y es lo que encuentra el patron que la semana pasada
  # todavia no era una regla. A las 08:00 UTC para no solaparse con
  # `secret-scan.yml` (06:00), y a la misma hora que los otros dos repositorios.
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # El interruptor descrito arriba. Mientras no exista la variable, el trabajo no
    # arranca; el dia que exista, corre completo sin tocar este fichero.
    #
    # Aqui hubo ademas un `github.actor != 'dependabot[bot]'`, que era codigo muerto:
    # Dependabot se retiro de los tres repositorios y ya no existe `.github/dependabot.yml`.
    if: vars.CODE_SECURITY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Publicar las alertas en la pestana Security.
      security-events: write
      # CodeQL consulta la API de Actions para correlacionar el analisis con su
      # ejecucion; en repositorio privado es obligatorio.
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `build-mode: none` es lo correcto para un lenguaje interpretado: CodeQL
      # extrae de las fuentes. No hay `npm ci` a proposito -- un build aqui no
      # aportaria nada al analisis y si abriria la ejecucion de scripts de
      # instalacion de terceros dentro de un job con `security-events: write`.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:javascript-typescript
