# BE-27. Nadie renueva las dependencias ni las actions clavadas por SHA: sin esto,
# un CVE publicado hoy sigue en el arbol hasta que alguien lo mire a mano.
#
# Dos decisiones que no son de estilo:
#
#   - `target-branch: develop`. Sin ella Dependabot abre contra la rama por
#     defecto. En GitFlow eso es `main`, que solo recibe releases, y
#     `gitflow-guard.yml` marcaria el PR en rojo por rama destino invalida.
#   - Agrupado. Sin `groups`, cada bump es un PR: con 8 dependencias de
#     produccion, 33 de desarrollo y 6 workflows, la cola semanal sepulta la
#     revision y se acaba mezclando a ciegas. Se agrupan minor y patch; los
#     major salen sueltos a proposito, porque son los que rompen.
#
# La rama que crea Dependabot (`dependabot/npm_and_yarn/...`) esta admitida en
# `gitflow-guard.yml` SOLO cuando el autor del PR es `dependabot[bot]`.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Dependencias npm del front.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - npm
    # El repo usa commitlint con la config de gitmoji (`commitlint.config.js`) y
    # el shortcode como forma viva (`:bookmark: chore(release):` en
    # prepare-release.yml). `include: scope` anade `(deps)` / `(deps-dev)`, asi
    # que el prefijo NO lo lleva ya.
    commit-message:
      prefix: ':arrow_up: chore'
      prefix-development: ':arrow_up: chore'
      include: scope
    groups:
      npm-produccion:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-desarrollo:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      # Un CVE no espera al lunes ni comparte PR con un bump rutinario: las
      # actualizaciones de seguridad van todas juntas y aparte.
      npm-seguridad:
        applies-to: security-updates
        patterns:
          - '*'

  # ---------------------------------------------------------------------------
  # Actions de los workflows. Estan clavadas por SHA -- que es lo correcto-- y
  # justo por eso nadie las renueva: un SHA no caduca solo. Dependabot reescribe
  # el SHA y el comentario `# vX.Y.Z` a la vez.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ':arrow_up: ci'
      include: scope
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
